name: XUYI one-time D1 cover permission audit
on:
  push:
    paths:
      - ".github/workflows/check-xuyi-d1-access-20261023.yml"
permissions:
  contents: read
jobs:
  check-d1:
    if: github.event.head_commit.message == 'Audit XUYI D1 cover repair capability'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a4032d0251103d6ef680b2aaddce1afc
    steps:
      - name: Check D1 API permission without printing secrets or database contents
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          url=f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database?per_page=100"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:payload=json.load(response)
              names=[str(item.get("name","")) for item in payload.get("result",[]) if isinstance(item,dict)]
              print("D1_API_LIST_ALLOWED",bool(payload.get("success")))
              print("XUYI_D1_FOUND","xuyi-drinkware-d1" in names)
          except urllib.error.HTTPError as error:
              print("D1_API_HTTP_STATUS",error.code)
          except Exception as error:
              print("D1_API_CHECK_NOT_AVAILABLE",type(error).__name__)
          PY
