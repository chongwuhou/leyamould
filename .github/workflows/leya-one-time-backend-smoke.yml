name: LEYA one-time backend smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/leya-one-time-backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      XUYI_SITE_ORIGIN: https://leyamould.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read-only production backend smoke test
        run: |
          python - <<'PY'
          import json, os, urllib.request
          origin = os.environ["XUYI_SITE_ORIGIN"].rstrip("/")
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          paths = [
              "/api/build-snapshot",
              "/api/publish-state",
              "/api/admin/pages",
              "/api/admin/product-content",
              "/api/admin/page-content",
              "/api/admin/page-translations",
          ]
          results = {}
          for path in paths:
              req = urllib.request.Request(origin + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
                  "User-Agent": "LEYA-MOULD-BACKEND-SMOKE/v1",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
                  results[path] = {
                      "status": response.status,
                      "keys": sorted(data)[:12] if isinstance(data, dict) else type(data).__name__,
                  }
          snapshot = results["/api/build-snapshot"]
          assert snapshot["status"] == 200
          print("LEYA_BACKEND_SMOKE_OK", json.dumps(results, ensure_ascii=False, sort_keys=True))
          PY
