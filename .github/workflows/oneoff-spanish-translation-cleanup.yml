name: One-time Spanish translation cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-spanish-translation-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a4032d0251103d6ef680b2aaddce1afc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Replace reviewed Spanish page labels
        shell: bash
        run: |
          cat > /tmp/leya-es-cleanup.sql <<'SQL'
          UPDATE xuyi_translation_overrides
          SET translated_json =
            replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(translated_json,
              'Learn More','Más información'),
              'EXPLORE OUR WORK','EXPLORA NUESTRO TRABAJO'),
              'PRECISION TOOLING','MOLDES DE PRECISIÓN'),
              'BOTTLE CAP MACHINE','MÁQUINA DE TAPONES'),
              'BOTTLE CAP MOULDS','MOLDES DE TAPONES'),
              'Our Products','Nuestros productos'),
              'Mould Product Families','Familias de moldes'),
              'Model Reference','Referencia de modelo'),
              'Additional Cap Model References','Referencias adicionales de modelos'),
              'Years of Experience','Años de experiencia'),
              'Countries Served','Países atendidos'),
              'Moulds Delivered','Moldes entregados'),
              'Trial samples','Muestras de prueba'),
              'Quality Assurance','Garantía de calidad'),
              'What Buyers Say','Lo que dicen los compradores'),
              'Trial runs, dimensional checks','Pruebas y controles dimensionales')
          WHERE locale='es' AND resource_id LIKE 'page:%';
          UPDATE xuyi_translation_overrides
          SET translated_json =
            replace(replace(replace(replace(replace(translated_json,
              'Quality evidence is kept','Conservamos las evidencias de calidad'),
              'LEYA MOULD production references show','Las referencias de producción de LEYA MOULD muestran'),
              'What is the typical cycle time?','¿Cuál es el tiempo de ciclo habitual?'),
              'Can one mould run','¿Puede un molde trabajar'),
              'Do you provide installation support?','¿Ofrecen soporte de instalación?')
          WHERE locale='es' AND resource_id LIKE 'page:%';
          SQL
          npx --yes wrangler@4.148.0 d1 execute leyamould-d1 --remote --file=/tmp/leya-es-cleanup.sql
