name: One-time LEYA Spanish D1 translation backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-translation-backfill.yml"
      - "scripts/oneoff_translation_backfill.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a4032d0251103d6ef680b2aaddce1afc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reviewed Spanish translation payload
        run: python scripts/oneoff_translation_backfill.py
      - name: Write translation overrides to LEYA D1 once
        run: npx --yes wrangler@4.148.0 d1 execute leyamould-d1 --remote --file=_local_ops/translation-backfill.sql

