name: Leyamould mould-site source build
# The source workflow is the only deployment path; D1 content is fetched before each clean build.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-leyamould.yml"
      - "mould_build.py"
      - "mould_category_pages.py"
      - "build.py"
      - "templates/**"
      - "assets/**"
      - "data/mould-catalog.json"
      - "data/mould-news-editorial.json"
      - "data/mould-news-image-manifest.json"
      - "data/mould-models.json"
      - "data/mould-product-structured.json"
      - "data/mould-page-structured.json"
      - "data/site-navigation-defaults.json"
      - "locale_registry.py"
      - "deployment/site.config.json"
      - "scripts/build_release.py"
      - "scripts/test_mould_release.py"
      - "scripts/test_mould_news_editorial.py"
      - "scripts/r2_usage_index.py"
      - "scripts/test_r2_usage_index.py"
      - "scripts/test_mould_backend_contract.py"
      - "scripts/test_mould_admin_contract.py"
      - "scripts/test_mould_media_publish_contract.py"
      - "scripts/test_mould_model_references.py"
      - "scripts/test_mould_d1_source_authority.py"
      - "scripts/test_mould_page_copy_d1_contract.py"
      - "scripts/migrate_mould_content.py"
      - "scripts/prepare_model_reference_import.py"
      - "scripts/verify_production_release.py"
      - "functions/**"
      - "admin/**"
      - "AGENTS.md"
      - "PROJECT_CHANGE_POLICY.md"
      - "项目圣经/**"
  workflow_dispatch:

concurrency:
  group: leyamould-source-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a4032d0251103d6ef680b2aaddce1afc
      LEYA_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical human and AI operating runbook
        run: python scripts/test_operating_runbook.py
      - name: Fail fast on Pages Function syntax
        run: python scripts/test_pages_functions_syntax.py
      - name: Verify repository hygiene and generic entrypoints
        run: python scripts/test_repository_hygiene.py
      - name: Verify LEYA MOULD backend module boundary
        run: python scripts/test_mould_backend_contract.py
      - name: Verify LEYA MOULD admin UI/API contract
        run: python scripts/test_mould_admin_contract.py
      - name: Verify LEYA media and publish revision contract
        run: python scripts/test_mould_media_publish_contract.py
      - name: Verify LEYA model-reference D1/R2 contract
        run: python scripts/test_mould_model_references.py
      - name: Verify LEYA D1 content-source authority
        run: python scripts/test_mould_d1_source_authority.py
      - name: Verify LEYA product catalog D1 authority
        run: python scripts/test_mould_product_d1_contract.py
      - name: Verify LEYA structured page copy and shared CTA D1 authority
        run: python scripts/test_mould_page_copy_d1_contract.py
      - name: Validate site isolation
        run: python scripts/preflight.py
      - name: Verify D1-driven language and publish guards
        run: python scripts/test_dynamic_language_and_publish_guards.py
      - name: Fetch reviewed LEYA D1 build snapshot
        run: python scripts/fetch_build_snapshot.py
      - name: Build mould source release
        run: python scripts/build_release.py
      - name: Validate mould routes, configured locales and contacts
        run: python scripts/test_mould_release.py
      - name: Generate and validate public R2 reference index
        run: |
          python scripts/r2_usage_index.py
          python scripts/test_r2_usage_index.py
      - name: Verify shared templates
        run: python scripts/test_shared_templates.py
      - name: Verify second clean source rebuild
        run: |
          python scripts/fetch_build_snapshot.py
          python scripts/build_release.py
          python scripts/test_mould_release.py
          python scripts/r2_usage_index.py
          python scripts/test_r2_usage_index.py
      - name: Deploy Leyamould production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.148.0 pages deploy dist --project-name leyamould --branch main
      - name: Seed LEYA News and shared shell content into D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: python scripts/migrate_mould_content.py
      - name: Rebuild and redeploy from seeded D1 content
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          python scripts/fetch_build_snapshot.py
          python scripts/build_release.py
          python scripts/test_mould_release.py
          python scripts/r2_usage_index.py
          python scripts/test_r2_usage_index.py
          npx --yes wrangler@4.148.0 pages deploy dist --project-name leyamould --branch main
      - name: Verify deployed build metadata and R2 reference index
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: python scripts/verify_production_release.py
      - name: Verify production deployment authorization
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is not configured; source build passed but production was not deployed."
          exit 1
