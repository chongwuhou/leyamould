name: XUYI daily one authentic product review
on:
  schedule:
    # One real publication per Beijing calendar date at approximately 09:17.
    # No synthetic backdating. GitHub Actions may run a few minutes late.
    - cron: "17 1 * * *"
  workflow_dispatch:
concurrency:
  group: xuyi-drinkware-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish-reviewed-excel:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact Excel-to-SKU mapping and deduplication
        run: |
          python scripts/test_daily_product_reviews.py
          node scripts/test_daily_product_reviews_api.mjs
          python scripts/publish_daily_product_reviews.py --dry-run
      - name: Publish one never-before-published SKU for the current Beijing date
        run: python scripts/publish_daily_product_reviews.py
