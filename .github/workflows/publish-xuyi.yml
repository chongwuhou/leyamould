          # Verify it here, after Pages deploy, with the existing authenticated build token.
          curl --fail --silent --show-error --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$SITE_ORIGIN/api/admin/home-banners" -o /dev/null
          for n in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --retry 2 "$SITE_ORIGIN/build-meta.json?xuyi_check=$n&sha=$GITHUB_SHA" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);process.exit(v.pagesProject==='xuyi-drinkware-site'&&v.sourceRevision===process.env.GITHUB_SHA&&Number(v.publishRevision)>=Number(process.env.XUYI_PUBLISH_REVISION)?0:1)})"; then
              echo "XUYI production revision verified"
              exit 0
            fi
            sleep 15
          done
          echo "::error::XUYI production build-meta did not update"
          exit 1
      - name: Verify live Blog single heading and critical routes
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        run: python scripts/verify_live.py
      - name: Verify all 15 live 2026-10-26 article routes
        if: github.event_name == 'push' && steps.credential.outputs.ready == 'true' && startsWith(github.event.head_commit.message, 'Publish reviewed 2026-10-26 B2B long-tail guides')
        shell: bash
        run: |
          set -euo pipefail
          for slug in coffee-shop-branded-water-bottles-wholesale museum-gift-shop-custom-water-bottles-wholesale auto-dealership-branded-water-bottles-bulk; do
            for locale in en es pt ru tr; do
              prefix=""
              if [ "$locale" != "en" ]; then prefix="/$locale"; fi
              url="$SITE_ORIGIN${prefix}/blog/${slug}/"
              body="$(curl --fail --silent --show-error --retry 2 "$url")"
              printf '%s' "$body" | grep -Fq 'class="blog-editorial__body"'
              printf '%s' "$body" | grep -Fq 'class="blog-related__item"'
              index="$(curl --fail --silent --show-error --retry 2 "$SITE_ORIGIN${prefix}/blog/")"
              printf '%s' "$index" | grep -Fq "$slug"
            done
          done
          echo "XUYI_20261026_LIVE_BLOG_ROUTES_VERIFIED"
      # Owner-approved IndexNow: notify ONLY after Cloudflare deploy and live
      # revision checks. The verified root key is generated from the
      # XUYI_INDEXNOW_KEY secret during the standard build, if configured.
      - name: Notify IndexNow of verified changed URLs
        if: steps.credential.outputs.ready == 'true' && (github.event_name != 'schedule' || steps.revision.outputs.needed == 'true')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${XUYI_INDEXNOW_KEY}" ]; then
            echo "::warning::IndexNow inactive: add XUYI_INDEXNOW_KEY repository secret."
            exit 0
          fi
          python scripts/search_submission.py --submit
