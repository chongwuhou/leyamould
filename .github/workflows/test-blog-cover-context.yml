name: XUYI Blog Cover Context Tests
on:
  push:
    branches:
      - "fix/blog-cover-context-20261026"
    paths:
      - "blog_media_source.py"
      - "functions/blog/**"
      - "data/blog-photo-context-corrections-20261026.json"
      - "assets/blog/*20261026.webp"
      - "scripts/test_blog_cover_override_runtime.mjs"
      - "scripts/test_20261026_blog_cms_owner_priority.py"
      - ".github/workflows/test-blog-cover-context.yml"
  pull_request:
    branches: [main]
    paths:
      - "blog_media_source.py"
      - "functions/blog/**"
      - "data/blog-photo-context-corrections-20261026.json"
      - "assets/blog/*20261026.webp"
      - "scripts/test_blog_cover_override_runtime.mjs"
      - "scripts/test_20261026_blog_cms_owner_priority.py"
      - ".github/workflows/test-blog-cover-context.yml"
permissions:
  contents: read
jobs:
  test-blog-cover-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate Oct 26 CMS and localized cover priority
        run: python scripts/test_20261026_blog_cms_owner_priority.py
      - name: Validate prior photo corrections remain safe
        run: python scripts/test_20261025_blog_photos_cms_priority.py
      - name: Validate D1 runtime cover and ALT behavior
        run: node scripts/test_blog_cover_override_runtime.mjs
