name: Leyamould backend contract tests
on:
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "scripts/**"
      - "项目圣经/**"
      - ".github/workflows/test-product-reviews.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "scripts/**"
      - "项目圣经/**"
      - ".github/workflows/test-product-reviews.yml"
permissions:
  contents: read
jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript Functions syntax
        run: python scripts/test_pages_functions_syntax.py
      - name: Check mould release and shared templates
        run: |
          python scripts/build_release.py
          python scripts/test_mould_release.py
          python scripts/test_shared_templates.py
      - name: Check D1-driven publish guards and operating runbook
        run: |
          python scripts/test_dynamic_language_and_publish_guards.py
          python scripts/test_operating_runbook.py
          python scripts/test_repository_hygiene.py
