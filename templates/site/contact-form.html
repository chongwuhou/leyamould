<form class="form" id="inquiry" aria-label="{{FORM_ARIA}}"><p class="inquiry-required-note">{{FORM_REQUIRED_NOTE}}</p><div class="form__row"><label>{{FORM_COMPANY}}<input name="company" placeholder="{{FORM_COMPANY_PLACEHOLDER}}" autocomplete="organization" required></label><label>{{FORM_EMAIL}}<input name="email" type="email" placeholder="name@company.com" autocomplete="email" required></label></div><div class="form__row"><label>{{FORM_CATEGORY}}<input name="model" id="inquiry-model" placeholder="{{FORM_CATEGORY_PLACEHOLDER}}"></label><label>{{FORM_QUANTITY}}<input name="quantity" placeholder="{{FORM_QUANTITY_PLACEHOLDER}}"></label></div><div class="form__row"><label>{{FORM_COUNTRY}}<input name="country" placeholder="{{FORM_COUNTRY_PLACEHOLDER}}"></label><label>{{FORM_TYPE}}<select name="type"><option>{{FORM_TYPE_QUOTE}}</option><option>{{FORM_TYPE_NEW}}</option><option>{{FORM_TYPE_REVIEW}}</option><option>{{FORM_TYPE_TECH}}</option></select></label></div><label>{{FORM_MATERIAL}}<select name="material"><option value="">{{FORM_ADVISE}}</option><option>PET</option><option>PP</option><option>HDPE</option><option>{{FORM_OTHER}}</option></select></label><label>{{FORM_REQUIREMENTS}}<textarea name="requirements" rows="5" required placeholder="{{FORM_REQUIREMENTS_PLACEHOLDER}}"></textarea></label><label style="display:flex;align-items:start;gap:8px"><input type="checkbox" name="consent" style="width:auto;margin-top:3px" required> {{FORM_CONSENT}} <a href="/privacy-policy/">{{FORM_PRIVACY}}</a>.</label><label style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button class="button" type="submit">{{FORM_SUBMIT}}</button><p id="inquiry-status" role="status" aria-live="polite" style="font-size:13px;margin:0"></p></form>
