<form class="form contact-form-reference" id="inquiry" aria-label="{{FORM_ARIA}}">
  <div class="form__row">
    <label>{{FORM_NAME}}<input name="name" autocomplete="name" placeholder="John Smith" required></label>
    <label>{{FORM_EMAIL}}<input name="email" type="email" autocomplete="email" placeholder="john@example.com" required></label>
  </div>
  <div class="form__row">
    <label>{{FORM_PHONE}}<input name="phone" type="tel" autocomplete="tel" placeholder="+86 136 0672 7715" required></label>
    <label>{{FORM_COMPANY}}<input name="company" autocomplete="organization" placeholder="Your company"></label>
  </div>
  <label>{{FORM_CATEGORY}}<select name="model" id="inquiry-model" required>
    <option value="">{{FORM_CATEGORY_PLACEHOLDER}}</option>
    <option>Mineral Water Cap Mould</option>
    <option>Beverage Bottle Cap Mould</option>
    <option>Edible Oil Bottle Cap Mould</option>
    <option>Medical Bottle Cap Mould</option>
    <option>Cosmetic Cap Mould</option>
    <option>Flip Top Cap Mould</option>
    <option>Tamper-Evident Cap Mould</option>
    <option>Custom Closure Mould</option>
    <option>Other / Not Sure</option>
  </select></label>
  <label>{{FORM_REQUIREMENTS}}<textarea name="requirements" rows="5" placeholder="Share cap design, material, cavity count and production volume." required></textarea></label>
  <input type="hidden" name="consent" value="accepted">
  <input type="hidden" name="website" value="">
  <p class="contact-privacy-note">🔒 {{FORM_PRIVACY_NOTE}} <a href="/privacy-policy/">{{FORM_PRIVACY}}</a>.</p>
  <button class="button" type="submit">{{FORM_SUBMIT}}</button>
  <p id="inquiry-status" role="status" aria-live="polite"></p>
</form>
