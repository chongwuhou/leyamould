<form class="form" id="inquiry" aria-label="Wholesale inquiry form"><p class="inquiry-required-note">Only company name, work email and your project requirements are required. Other details are optional; privacy consent is needed to send.</p><div class="form__row"><label>Company Name<input name="company" placeholder="Your company" autocomplete="organization" required></label><label>Work Email<input name="email" type="email" placeholder="name@company.com" autocomplete="email" required></label></div><div class="form__row"><label>Product Model<input name="model" id="inquiry-model" placeholder="e.g. 2501"></label><label>Estimated Quantity<input name="quantity" placeholder="e.g. 3000 pcs"></label></div><div class="form__row"><label>Destination Country<input name="country" placeholder="Country"></label><label>Inquiry Type<select name="type"><option>Wholesale Quote</option><option>Custom Logo / Branding</option><option>Samples</option><option>OEM / ODM</option></select></label></div><label>Material Preference<select name="material"><option value="">Please advise</option><option>PC</option><option>Tritan</option><option>PP</option><option>PETG</option></select></label><label>Your Requirements<textarea name="requirements" rows="5" required placeholder="Capacity, BPA-free option, logo, colors, packaging, shipping, delivery date"></textarea></label><label style="display:flex;align-items:start;gap:8px"><input type="checkbox" name="consent" style="width:auto;margin-top:3px" required> I agree to the <a href="/privacy-policy/">privacy policy</a> and the processing of my business enquiry.</label><label style="position:absolute;left:-9999px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button class="button" type="submit">Send Inquiry →</button><p id="inquiry-status" role="status" aria-live="polite" style="font-size:13px;margin:0"></p></form>
